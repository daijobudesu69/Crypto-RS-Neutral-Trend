name: RNT control

# Ganti mode bot. Menulis control/bot.yaml di main; watcher membacanya setiap
# siklus, jadi berlaku <= ~10 menit. Dari PowerShell / CMD / Git Bash:
#   gh workflow run control.yml -f mode=live
#   gh workflow run control.yml -f mode=manage        # rem: hanya kurangi/tutup posisi
#   gh workflow run control.yml -f mode=flatten       # tutup semua posisi live RNT
#   gh workflow run control.yml -f mode=paper         # kembali paper saja
#   gh workflow run control.yml -f reset_breaker=true # reset alarm (puncak + CUSUM)
# Telegram mengonfirmasi "mode sekarang: ..." begitu watcher memakainya.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "mode bot (tetap = tidak diubah)"
        type: choice
        # Dikutip: YAML 1.1 membaca off tanpa kutip sebagai boolean false.
        options: ["tetap", "off", "paper", "live", "manage", "flatten"]
        default: tetap
      reset_breaker:
        description: "reset alarm: puncak ekuitas dan CUSUM dihitung ulang mulai hari ini"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rnt-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install PyYAML==6.0.3
      - name: Tulis control/bot.yaml
        env:
          MODE: ${{ inputs.mode }}
          RESET: ${{ inputs.reset_breaker }}
        run: bash tools/save_control.sh
